<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Criar conta</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Criar conta</h1>

        {% if mensagem %}
            <p>{{ mensagem }}</p>
        {% endif %}

        <form method="POST">

            <label>Número da conta:</label>

            <input
                type="text"
                name="numero_conta"
                required
            >

            <label>CPF do titular:</label>

            <input
                type="text"
                name="cpf_cliente"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <a href="/">
            Voltar
        </a>

    </div>

</body>

</html>
